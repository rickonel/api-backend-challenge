services:
  postgres:
    image: postgres:16.3
    container_name: backend-challenge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backend_challenge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-challenge-api
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-backend_challenge}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_DURATION_DAYS: ${SESSION_DURATION_DAYS:-7}
      COOKIE_SECRET: ${COOKIE_SECRET:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app/src
      - ./scripts:/usr/src/app/scripts
    command: npm run dev

volumes:
  postgres_data:
